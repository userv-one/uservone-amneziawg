name: ci

on:
  push:
    branches: [main, uservone-core]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
        shell: bash
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet -unsafeptr=false ./...
      - name: Build management CLI
        run: go build ./cmd/uservone-awg

  race-and-fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Race tests
        run: go test -race ./...
      - name: Obfuscation fuzz smoke test
        run: go test ./device -run '^$' -fuzz FuzzObfChainDeobfuscationNeverPanics -fuzztime 15s
