name: release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Use LF line endings
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Validate semver tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "not a semver release tag: $GITHUB_REF_NAME"
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Linux release assets
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: linux
        run: |
          set -euo pipefail
          mkdir -p dist
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          LDFLAGS="-s -w -X github.com/userv-one/uservone-amneziawg/v3/buildinfo.Version=${RELEASE_VERSION} -X github.com/userv-one/uservone-amneziawg/v3/buildinfo.Commit=${GITHUB_SHA}"
          for arch in amd64 arm64; do
            GOARCH="$arch" go build -trimpath -ldflags "$LDFLAGS" \
              -o "dist/uservone-amneziawg-linux-$arch" .
            GOARCH="$arch" go build -trimpath -ldflags "$LDFLAGS" \
              -o "dist/uservone-awg-linux-$arch" ./cmd/uservone-awg
            file "dist/uservone-amneziawg-linux-$arch" "dist/uservone-awg-linux-$arch"
          done
          git archive --format=zip --prefix="uservone-amneziawg-${GITHUB_REF_NAME}/" \
            -o "dist/uservone-amneziawg-${GITHUB_REF_NAME}-source.zip" HEAD
      - name: Generate buildinfo and checksums
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          tag = os.environ["TAG"]
          commit = os.environ["COMMIT"]
          info = {
              "product": "uservone-amneziawg",
              "tag": tag,
              "version": tag.lstrip("v"),
              "commit": commit,
              "upstream": "https://github.com/amnezia-vpn/amneziawg-go",
              "upstream_commit": "b5928efb6ca19f0153958460c3d141f04abc5c2e",
              "go_version": subprocess.check_output(["go", "version"], text=True).split()[2],
              "platforms": ["linux/amd64", "linux/arm64"],
              "assets": [
                  "uservone-amneziawg-linux-amd64",
                  "uservone-amneziawg-linux-arm64",
                  "uservone-awg-linux-amd64",
                  "uservone-awg-linux-arm64",
                  f"uservone-amneziawg-{tag}-source.zip",
                  "buildinfo.json",
                  "SHA256SUMS",
              ],
          }
          with open("dist/buildinfo.json", "w", encoding="utf-8") as file:
              json.dump(info, file, indent=2, sort_keys=True)
              file.write("\n")
          PY
          cd dist
          files=(
            uservone-amneziawg-linux-amd64
            uservone-amneziawg-linux-arm64
            uservone-awg-linux-amd64
            uservone-awg-linux-arm64
            "uservone-amneziawg-${TAG}-source.zip"
            buildinfo.json
          )
          sha256sum "${files[@]}" > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "uservone-amneziawg $TAG" \
            --generate-notes
          gh release view "$TAG" --json tagName,url,assets
